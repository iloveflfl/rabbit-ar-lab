name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  web-and-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:facts
      - run: npm run test:e2e
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug APK
        working-directory: apps/rabbit-server-android
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rabbit-ar-server-debug-apk
          path: apps/rabbit-server-android/app/build/outputs/apk/debug/app-debug.apk
